name: Deploy

# Deploy to Cloudflare when a GitHub release is published.
# Can also be started by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and check
        run: |
          npx cf build
          npx cf deploy --prebuilt --dry-run

      # Worker secrets come from GitHub secrets, written to a file that only lives in this job.
      - name: Write secrets file
        run: |
          umask 077
          cat > .secrets.env <<EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
          OWNER_ID=${{ secrets.OWNER_ID }}
          EOF

      - name: Deploy
        run: npx cf deploy --prebuilt --secrets-file .secrets.env --message "${{ github.event.release.tag_name || github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove secrets file
        if: always()
        run: rm -f .secrets.env
